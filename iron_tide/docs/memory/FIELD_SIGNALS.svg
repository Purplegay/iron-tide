<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc">
<title id="title">远征战场支线：留守、撤出与体检</title><desc id="desc">交互示意图。两岸通话各台就地显示缺员或留守。交班按阶段提示。诊所显示体检进度。</desc>
<defs><pattern id="grid" width="64" height="32" patternUnits="userSpaceOnUse"><path d="M0 16L32 0 64 16 32 32Z" fill="none" stroke="#44514b"/></pattern><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#f4f4ea;font-size:18px}.sub{fill:#bacbc6;font-size:16px}.mint{fill:#a3efc1}.gold{fill:#ffe1a8}.tag{fill:#182728;stroke:#70837b}.head{font-size:23px;font-weight:bold}</style></defs>
<rect width="900" height="610" fill="#182423"/><text x="32" y="46" class="head">远征支线 · 战场判读</text><text x="692" y="44" class="sub">状态示意 / 非截图</text>
<rect x="24" y="70" width="852" height="206" fill="#354139"/><rect x="24" y="70" width="852" height="206" fill="url(#grid)"/><text x="43" y="103" class="head">01　两岸通话</text>
<g fill="none" stroke-width="2"><ellipse cx="242" cy="203" rx="86" ry="33" stroke="#a3efc1"/><ellipse cx="663" cy="203" rx="86" ry="33" stroke="#ffe1a8"/><path d="M330 204h240" stroke="#99aaa1" stroke-dasharray="7 7"/></g>
<g fill="#bdc9b7"><path d="M229 212l13-36 13 36-13-8zM650 212l13-36 13 36-13-8z"/></g>
<rect class="tag" x="136" y="124" width="213" height="38"/><text x="151" y="150" class="mint">A 台 · 已就位 · 留守</text><rect class="tag" x="540" y="124" width="248" height="38"/><text x="556" y="150" class="gold">B 台 · 缺一队 · 派兵到此</text><text x="43" y="260" class="sub">两台都有人 → 同时显示「保持通信 3/5秒」；一台离人，计时归零。</text>
<text x="43" y="321" class="head">02　双人交班</text><text x="43" y="354" class="sub">同一个点，前后两个时刻</text><rect class="tag" x="43" y="372" width="350" height="48"/><text x="60" y="403" class="gold">双人交班 · 首班已签到 · 请撤出</text><path d="M417 395h55m-10-8 10 8-10 8" fill="none" stroke="#bdc9b7" stroke-width="2"/><rect class="tag" x="497" y="372" width="350" height="48"/><text x="517" y="403" class="gold">双人交班 · 换另一队入圈接班</text>
<path d="M24 450h852" stroke="#617169"/><text x="43" y="490" class="head">03　流动诊所</text><rect class="tag" x="43" y="513" width="437" height="53"/><text x="58" y="543">流动诊所 · 伤员即治 · 满血体检 4/6秒</text><path d="M58 555h399" stroke="#556563" stroke-width="4"/><path d="M58 555h266" stroke="#a3efc1" stroke-width="4"/><text x="513" y="537" class="sub">伤员到场即治疗；全军满血也能完成。</text><text x="513" y="563" class="sub">体检中离圈，进度归零。</text>
</svg>
