<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-label="战场标记阶段示意">
<style>text{font:19px 'Microsoft YaHei',sans-serif;fill:#eef4ec}.small{font-size:15px;fill:#b1c7c0}.gold{fill:#ffdb91}.green{fill:#a3efc1}</style>
<rect width="840" height="480" fill="#172729"/><text x="30" y="43" style="font-size:26px">远征支线 · 下一步在哪里</text><text class="small" x="674" y="43">示意 / 非截图</text>
<path d="M30 65h780M30 157h780M30 270h780M30 367h780" stroke="#52635e"/>
<text x="30" y="106">回收军需</text><text class="gold" x="195" y="106">敌军争夺 · 清敌后继续</text><rect x="195" y="122" width="300" height="8" fill="#54635c"/><rect x="195" y="122" width="180" height="8" fill="#ffdb91"/><text class="small" x="530" y="131">剩余 8 秒 · 已有进度保留</text>
