<text x="30" y="311">静默监听</text><text class="gold" x="195" y="311">多余单位撤出 · 只留一队</text><text class="green" x="510" y="311">单队监听 3/8秒</text><rect x="510" y="330" width="220" height="6" fill="#54635c"/><rect x="510" y="330" width="83" height="6" fill="#a3efc1"/>
